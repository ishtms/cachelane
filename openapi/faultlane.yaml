openapi: 3.1.1
info:
  title: FaultLane API
  version: 0.1.0
  description: Versioned control, setup, crash ingest, and health contract for FaultLane.
servers:
  - url: http://127.0.0.1:8080
    description: Local API development
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Report whether the process is alive
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Report whether the role can receive work
      responses:
        "200":
          description: Role is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/health:
    get:
      operationId: getApiHealth
      summary: Report API health through the versioned namespace
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/demo:
    get:
      operationId: getPublicDemo
      summary: Describe the configured synthetic read-only demo
      responses:
        "200":
          description: Public demo summary
          headers:
            Cache-Control:
              schema:
                type: string
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicDemoInfo"
        "429":
          description: Public demo request limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/demo/health:
    get:
      operationId: getPublicDemoHealth
      summary: Check whether the configured synthetic demo project is available
      responses:
        "200":
          description: Public demo is ready
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: ready
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/demo/issues:
    get:
      operationId: listPublicDemoIssues
      summary: List bounded issues from the configured synthetic demo project
      responses:
        "200":
          description: Bounded public demo issues
          headers:
            Cache-Control:
              schema:
                type: string
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicDemoIssueList"
        "429":
          description: Public demo request limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/demo/issues/{issue_key}:
    parameters:
      - name: issue_key
        in: path
        required: true
        description: Public fingerprint identity without an internal issue identifier
        schema:
          type: string
          pattern: ^[1-9][0-9]*-[a-f0-9]{64}$
    get:
      operationId: getPublicDemoIssue
      summary: Read a safe issue projection from the synthetic demo project
      responses:
        "200":
          description: Public demo issue detail
          headers:
            Cache-Control:
              schema:
                type: string
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicDemoIssueDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Public demo request limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/setup:
    post:
      operationId: createInitialProject
      summary: Create the first owner, organization, project, and ingest key
      description: Available only when loopback bootstrap authentication is explicitly enabled. The raw ingest key is returned once.
      security:
        - bootstrapAuthorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSetupRequest"
      responses:
        "201":
          description: Initial project created
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedSetup"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Initial setup is already complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/providers:
    get:
      operationId: getAuthenticationProviders
      summary: List configured hosted sign-in providers
      responses:
        "200":
          description: Hosted sign-in provider availability
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviders"
  /api/v1/auth/github/start:
    post:
      operationId: startGitHubSignIn
      summary: Start GitHub OAuth sign-in
      responses:
        "200":
          description: GitHub authorization URL
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubStart"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/auth/github/callback:
    post:
      operationId: completeGitHubSignIn
      summary: Exchange a GitHub OAuth callback for a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubCallback"
      responses:
        "201":
          description: Hosted session created
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/auth/email/start:
    post:
      operationId: startEmailSignIn
      summary: Send a single-use email sign-in link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailStart"
      responses:
        "202":
          description: Sign-in request accepted
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/auth/email/verify:
    post:
      operationId: verifyEmailSignIn
      summary: Exchange a single-use email token for a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretRequest"
      responses:
        "201":
          description: Hosted session created
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/auth/session:
    get:
      operationId: getCurrentSession
      summary: Get the current hosted session and memberships
      security:
        - sessionAuthorization: []
      responses:
        "200":
          description: Current hosted session
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      summary: List active sessions for the current user
      security:
        - sessionAuthorization: []
      responses:
        "200":
          description: Active hosted sessions
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    delete:
      operationId: revokeSession
      summary: Revoke one session owned by the current user
      security:
        - sessionAuthorization: []
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/organizations/{organization_id}/members:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: listOrganizationMembers
      summary: List members and manageable pending invitations
      security:
        - bootstrapAuthorization: []
        - sessionAuthorization: []
      responses:
        "200":
          description: Organization members
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/organizations/{organization_id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: updateOrganizationMember
      summary: Change an organization member role
      security:
        - bootstrapAuthorization: []
        - sessionAuthorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMember"
      responses:
        "200":
          description: Updated organization member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: removeOrganizationMember
      summary: Remove an organization member
      security:
        - bootstrapAuthorization: []
        - sessionAuthorization: []
      responses:
        "204":
          description: Organization member removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/organizations/{organization_id}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      operationId: createOrganizationInvitation
      summary: Invite an organization member
      security:
        - bootstrapAuthorization: []
        - sessionAuthorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitation"
      responses:
        "201":
          description: Organization invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/organizations/{organization_id}/invitations/{invitation_id}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/InvitationId"
    delete:
      operationId: revokeOrganizationInvitation
      summary: Revoke a pending organization invitation
      security:
        - bootstrapAuthorization: []
        - sessionAuthorization: []
      responses:
        "204":
          description: Organization invitation revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/invitations/accept:
    post:
      operationId: acceptOrganizationInvitation
      summary: Accept an organization invitation and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretRequest"
      responses:
        "200":
          description: Invitation accepted and hosted session created
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/organizations/{organization_id}/audit:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: listOrganizationAuditLog
      summary: List recent organization audit entries
      security:
        - bootstrapAuthorization: []
        - sessionAuthorization: []
      responses:
        "200":
          description: Recent organization audit entries
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{project_id}/setup:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectSetup
      summary: Get setup details without raw ingest keys
      security:
        - bootstrapAuthorization: []
        - sessionAuthorization: []
      responses:
        "200":
          description: Project setup details
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - setup
                properties:
                  setup:
                    $ref: "#/components/schemas/ProjectSetup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{project_id}/onboarding:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectOnboarding
      summary: Get the bounded first-crash onboarding state
      security:
        - bootstrapAuthorization: []
        - sessionAuthorization: []
      responses:
        "200":
          description: Current first-crash onboarding state
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOnboarding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/projects/{project_id}/ingest-keys:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createProjectIngestKey
      summary: Create another write-only ingest key
      description: The raw ingest key is returned once.
      security:
        - bootstrapAuthorization: []
        - sessionAuthorization: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestKeyPolicy"
      responses:
        "201":
          description: Ingest key created
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedSetup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{project_id}/ingest-keys/{key_id}/policy:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IngestKeyId"
    patch:
      operationId: updateProjectIngestKeyPolicy
      summary: Update one ingest key environment and source allowlist
      security:
        - bootstrapAuthorization: []
        - sessionAuthorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestKeyPolicy"
      responses:
        "200":
          description: Ingest key policy updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - setup
                properties:
                  setup:
                    $ref: "#/components/schemas/ProjectSetup"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{project_id}/ingest-keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IngestKeyId"
    delete:
      operationId: revokeProjectIngestKey
      summary: Revoke a project ingest key
      security:
        - bootstrapAuthorization: []
        - sessionAuthorization: []
      responses:
        "204":
          description: Ingest key revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{project_id}/events/{event_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCrashEventState
      summary: Get one project-scoped crash processing state
      security:
        - bootstrapAuthorization: []
        - sessionAuthorization: []
      responses:
        "200":
          description: Current crash processing state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventState"
        "404":
          $ref: "#/components/responses/IngestNotFound"
        "500":
          $ref: "#/components/responses/IngestInternalError"
  /api/v1/projects/{project_id}/overview:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectOverview
      summary: Get a fixed 30-day project health and observed usage overview
      security:
        - bootstrapAuthorization: []
        - sessionAuthorization: []
      responses:
        "200":
          description: Project overview from one repeatable-read snapshot
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOverview"
        "404":
          $ref: "#/components/responses/IssueNotFound"
        "500":
          $ref: "#/components/responses/IssueInternalError"
  /api/v1/projects/{project_id}/data-rules:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectDataRules
      summary: Get the active redaction and custom context indexing rules
      security:
        - bootstrapAuthorization: []
        - sessionAuthorization: []
      responses:
        "200":
          description: Current project data rules
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDataRules"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      operationId: updateProjectDataRules
      summary: Replace project data rules and queue existing derived data for reprocessing
      security:
        - bootstrapAuthorization: []
        - sessionAuthorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectDataRules"
      responses:
        "200":
          description: Rules were already current
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDataRules"
        "202":
          description: Rules were updated and reprocessing was queued
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDataRules"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/projects/{project_id}/usage:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectUsage
      summary: Get authoritative project usage and quota policy
      security:
        - bootstrapAuthorization: []
        - sessionAuthorization: []
      responses:
        "200":
          description: Current billing-cycle usage and policy
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectUsage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      operationId: updateProjectUsage
      summary: Update owner-controlled usage and retention settings
      security:
        - bootstrapAuthorization: []
        - sessionAuthorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectUsage"
      responses:
        "200":
          description: Current billing-cycle usage and updated policy
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectUsage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/projects/{project_id}/alerts:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectAlerts
      summary: Get project alert destinations, rules, condition state, and delivery state
      security:
        - bootstrapAuthorization: []
        - sessionAuthorization: []
      responses:
        "200":
          description: Current project alert configuration and state
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAlerts"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/projects/{project_id}/alert-integrations:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createProjectAlertIntegration
      summary: Create a project alert destination
      security:
        - bootstrapAuthorization: []
        - sessionAuthorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlertIntegration"
      responses:
        "201":
          description: Alert destination created
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertIntegration"
        "400":
