        format: uuid
  headers:
    CacheControlNoStore:
      description: Prevent storage of sensitive control and artifact metadata responses.
      schema:
        type: string
        const: no-store
    RateLimitLimit:
      description: The tighter applicable request limit.
      schema:
        type: integer
        minimum: 1
    RateLimitRemaining:
      description: Requests remaining in the current fixed window.
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: Seconds until the fixed window resets.
      schema:
        type: integer
        const: 60
  responses:
    InvalidRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authorization is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource is unavailable or outside the caller's organization
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The authenticated role cannot perform this operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: The authentication or delivery service is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidCrashRequest:
      description: Crash request transport or envelope validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestError"
    IngestNotFound:
      description: The ingest resource is unavailable or the event is outside the caller's scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestError"
    CrashRequestTooLarge:
      description: Crash request exceeded a configured resource limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestError"
    IngestInternalError:
      description: Crash request could not be completed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestError"
    IngestUnavailable:
      description: Crash ingestion is temporarily unavailable
      content:
        application/json:
              schema:
                $ref: "#/components/schemas/IngestError"
    InvalidUploadRequest:
      description: Artifact upload request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadError"
    UploadUnauthorized:
      description: Artifact upload token is missing, malformed, revoked, or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadError"
    UploadNotFound:
      description: The resource is absent or outside the upload token's project
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadError"
    UploadConflict:
      description: Multipart upload state changed and should be renegotiated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadError"
    UploadMismatch:
      description: The stored bytes do not match the declared checksum and embedded identity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadError"
    UploadUnavailable:
      description: PostgreSQL or object storage is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadError"
    IssueInvalidRequest:
      description: Issue request validation failed
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IssueNotFound:
      description: The issue resource is unavailable or outside the caller's organization
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IssueInternalError:
      description: Issue request could not be completed
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DashboardResultUnavailable:
      description: The current stored processing result is missing, corrupt, or unsupported
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DashboardArtifactUnavailable:
      description: The retained raw object cannot be streamed safely
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReprocessingInvalidRequest:
      description: Reprocessing request validation failed
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReprocessingNotFound:
      description: The request is unavailable, disabled, unauthorized, or outside the project
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReprocessingConflict:
      description: The idempotency key was used with another request body
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReprocessingLimitReached:
      description: Five manual requests are already unfinished for this project
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReprocessingInternalError:
      description: Reprocessing request state could not be read or changed
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    PublicDemoInfo:
      type: object
      additionalProperties: false
      required:
        - title
        - engine
        - synthetic
        - read_only
        - issue_count
        - last_seen_at
      properties:
        title:
          type: string
        engine:
          type: string
        synthetic:
          type: boolean
          const: true
        read_only:
          type: boolean
          const: true
        issue_count:
          type: integer
          minimum: 0
        last_seen_at:
          type:
            - string
            - "null"
          format: date-time
    PublicDemoIssueSummary:
      type: object
      additionalProperties: false
      required:
        - key
        - path
        - title
        - fingerprint
        - fingerprint_version
        - status
        - regression_state
        - first_seen_at
        - last_seen_at
        - event_count
        - affected_release_count
        - symbolication_state
        - crash_type
        - reprocessed
      properties:
        key:
          type: string
          pattern: ^[1-9][0-9]*-[a-f0-9]{64}$
        path:
          type: string
          pattern: ^/demo/issues/[1-9][0-9]*-[a-f0-9]{64}$
        title:
          type: string
          maxLength: 200
        fingerprint:
          type: string
          pattern: ^[a-f0-9]{64}$
        fingerprint_version:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - open
            - resolved
        regression_state:
          type: string
          enum:
            - new
            - ongoing
            - resolved
            - regressed
            - unknown
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        event_count:
          type: integer
          minimum: 1
        affected_release_count:
          type: integer
          minimum: 0
        symbolication_state:
          type: string
          enum:
            - readable
            - partial
            - missing
            - failed
            - processing
        crash_type:
          type:
            - string
            - "null"
        reprocessed:
          type: boolean
    PublicDemoIssueList:
      type: object
      additionalProperties: false
      required:
        - synthetic
        - read_only
        - items
        - truncated
      properties:
        synthetic:
          type: boolean
          const: true
        read_only:
          type: boolean
          const: true
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/PublicDemoIssueSummary"
        truncated:
          type: boolean
    PublicDemoVariant:
      type: object
      additionalProperties: false
      required:
        - fingerprint
        - first_seen_at
        - last_seen_at
        - event_count
      properties:
        fingerprint:
          type: string
          pattern: ^[a-f0-9]{64}$
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        event_count:
          type: integer
          minimum: 1
    PublicDemoRelease:
      type: object
      additionalProperties: false
      required:
        - version
        - platform
        - architecture
        - configuration
        - first_seen_at
        - last_seen_at
        - event_count
      properties:
        version:
          type: string
          maxLength: 128
        platform:
          type: string
          maxLength: 32
        architecture:
          type: string
          maxLength: 32
        configuration:
          type: string
          maxLength: 32
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        event_count:
          type: integer
          minimum: 1
    PublicDemoInline:
      type: object
      additionalProperties: false
      required:
        - function
        - source_file
        - source_line
      properties:
        function:
          type: string
          maxLength: 256
        source_file:
          type:
            - string
            - "null"
          maxLength: 128
        source_line:
          type:
            - integer
            - "null"
          minimum: 0
    PublicDemoFrame:
      type: object
      additionalProperties: false
      required:
        - module
        - function
        - source_file
        - source_line
        - inlines
        - inlines_truncated
      properties:
        module:
          type:
            - string
            - "null"
          maxLength: 128
        function:
          type:
            - string
            - "null"
          maxLength: 256
        source_file:
          type:
            - string
            - "null"
          maxLength: 128
        source_line:
          type:
            - integer
            - "null"
          minimum: 0
        inlines:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/PublicDemoInline"
        inlines_truncated:
          type: boolean
    PublicDemoThread:
      type: object
      additionalProperties: false
      required:
        - thread_id
        - faulting
        - frames
        - frames_truncated
      properties:
        thread_id:
          type: integer
        faulting:
          type: boolean
        frames:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/PublicDemoFrame"
        frames_truncated:
          type: boolean
    PublicDemoMissingSymbol:
      type: object
      additionalProperties: false
      required:
        - required_artifact
        - module
        - architecture
      properties:
        required_artifact:
          type: string
        module:
          type: string
          maxLength: 128
        architecture:
          type: string
          maxLength: 32
    PublicDemoIssueDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/PublicDemoIssueSummary"
        - type: object
          required:
            - synthetic
            - read_only
            - variants
            - variants_truncated
            - releases
            - releases_truncated
            - threads
            - threads_truncated
            - missing_symbols
            - missing_symbols_truncated
          properties:
            synthetic:
              type: boolean
              const: true
            read_only:
              type: boolean
              const: true
            variants:
              type: array
              maxItems: 32
              items:
                $ref: "#/components/schemas/PublicDemoVariant"
            variants_truncated:
              type: boolean
            releases:
              type: array
              maxItems: 32
              items:
                $ref: "#/components/schemas/PublicDemoRelease"
            releases_truncated:
              type: boolean
            threads:
              type: array
              maxItems: 16
              items:
                $ref: "#/components/schemas/PublicDemoThread"
            threads_truncated:
              type: boolean
            missing_symbols:
              type: array
              maxItems: 32
              items:
                $ref: "#/components/schemas/PublicDemoMissingSymbol"
            missing_symbols_truncated:
              type: boolean
    AuthProviders:
      type: object
      additionalProperties: false
      required:
        - github
        - email
      properties:
        github:
          type: boolean
        email:
          type: boolean
    GitHubStart:
      type: object
      additionalProperties: false
      required:
        - authorization_url
      properties:
        authorization_url:
          type: string
          format: uri
    GitHubCallback:
      type: object
      additionalProperties: false
      required:
        - code
        - state
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 512
        state:
          type: string
          minLength: 68
          maxLength: 68
    EmailStart:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    SecretRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 68
          maxLength: 68
    Role:
      type: string
      enum:
        - owner
        - admin
        - developer
        - viewer
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - email
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
    Membership:
      type: object
      additionalProperties: false
      required:
        - organization_id
        - organization_name
        - organization_slug
        - role
      properties:
        organization_id:
          type: string
          format: uuid
        organization_name:
          type: string
        organization_slug:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    Session:
      type: object
      additionalProperties: false
      required:
        - id
        - created_at
        - last_seen_at
        - expires_at
        - current
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean
    SessionResponse:
      type: object
      additionalProperties: false
      required:
        - session
        - user
        - memberships
      properties:
        session:
          $ref: "#/components/schemas/Session"
        user:
          $ref: "#/components/schemas/User"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
    SessionCreated:
      type: object
      additionalProperties: false
      required:
        - token
        - session
        - user
        - memberships
      properties:
        token:
          type: string
          writeOnly: true
        session:
          $ref: "#/components/schemas/Session"
        user:
          $ref: "#/components/schemas/User"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
    SessionList:
      type: object
      additionalProperties: false
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    Member:
      type: object
      additionalProperties: false
      required:
        - user_id
        - email
        - role
        - joined_at
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        joined_at:
          type: string
          format: date-time
    Invitation:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - role
        - expires_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    MemberList:
      type: object
      additionalProperties: false
      required:
        - members
        - invitations
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
    CreateInvitation:
      type: object
      additionalProperties: false
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: "#/components/schemas/Role"
    UpdateMember:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/Role"
    AuditEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - actor_user_id
        - action
        - target_type
        - target_id
        - result
        - occurred_at
      properties:
        id:
          type: string
          format: uuid
        actor_user_id:
          type:
            - string
            - "null"
          format: uuid
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        result:
          type: string
          enum:
            - succeeded
            - denied
            - failed
        occurred_at:
          type: string
          format: date-time
    AuditList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AuditEntry"
    Health:
      type: object
      additionalProperties: false
      required:
        - role
        - service
        - status
        - version
      properties:
        role:
          type: string
        service:
          type: string
          const: faultlane-server
        status:
          type: string
          const: ok
        version:
          type: string
    CreateSetupRequest:
      type: object
      additionalProperties: false
      required:
        - owner_email
        - organization_name
        - organization_slug
        - project_name
        - project_slug
      properties:
        owner_email:
          type: string
          format: email
          maxLength: 254
        organization_name:
          type: string
          minLength: 1
          maxLength: 80
        organization_slug:
          $ref: "#/components/schemas/Slug"
        project_name:
          type: string
          minLength: 1
          maxLength: 80
        project_slug:
          $ref: "#/components/schemas/Slug"
    Slug:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    Organization:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    IngestKey:
      type: object
      additionalProperties: false
      required:
        - id
        - display_suffix
        - environment
        - allowed_cidrs
        - created_at
        - revoked_at
      properties:
        id:
          type: string
          format: uuid
        display_suffix:
          type: string
          pattern: ^[a-f0-9]{8}$
        environment:
          $ref: "#/components/schemas/Environment"
        allowed_cidrs:
          type: array
          maxItems: 32
          items:
            type: string
            description: IPv4 or IPv6 CIDR
        created_at:
          type: string
          format: date-time
        revoked_at:
          type:
            - string
            - "null"
          format: date-time
    Environment:
      type: string
      minLength: 1
      maxLength: 32
      pattern: ^[a-z0-9][a-z0-9-]{0,31}$
    IngestKeyPolicy:
      type: object
      additionalProperties: false
      required:
        - environment
      properties:
        environment:
          $ref: "#/components/schemas/Environment"
        allowed_cidrs:
          type: array
          maxItems: 32
          default: []
          items:
            type: string
            description: IPv4 or IPv6 CIDR
    ProjectSetup:
      type: object
      additionalProperties: false
      required:
        - owner_id
        - organization
        - project
        - ingest_keys
      properties:
        owner_id:
          type: string
          format: uuid
        organization:
          $ref: "#/components/schemas/Organization"
        project:
          $ref: "#/components/schemas/Project"
        ingest_keys:
          type: array
          items:
            $ref: "#/components/schemas/IngestKey"
    ProjectOnboarding:
      type: object
      additionalProperties: false
      required:
        - state
        - event
        - release
        - missing_symbols
        - missing_symbols_truncated
        - commands
        - issue_path
        - diagnostic
      properties:
        state:
          type: string
          enum:
            - waiting
            - received
            - processing
            - missing_symbols
            - readable_issue
            - failed
            - quarantined
        event:
          oneOf:
            - $ref: "#/components/schemas/OnboardingEvent"
            - type: "null"
        release:
          oneOf:
            - $ref: "#/components/schemas/OnboardingRelease"
            - type: "null"
        missing_symbols:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/OnboardingMissingSymbol"
        missing_symbols_truncated:
          type: boolean
        commands:
          $ref: "#/components/schemas/OnboardingCommands"
        issue_path:
          type:
            - string
            - "null"
        diagnostic:
          oneOf:
            - $ref: "#/components/schemas/OnboardingDiagnostic"
            - type: "null"
    OnboardingEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - received_at
        - processing_state
      properties:
        id:
          type: string
          format: uuid
        received_at:
          type: string
          format: date-time
        processing_state:
          $ref: "#/components/schemas/ProcessingState"
    OnboardingRelease:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - platform
        - architecture
        - configuration
      properties:
        id:
          type:
            - string
            - "null"
          format: uuid
        version:
          type: string
          maxLength: 128
        platform:
          type:
            - string
            - "null"
          maxLength: 32
        architecture:
          type:
            - string
            - "null"
          maxLength: 32
        configuration:
          type:
            - string
            - "null"
          maxLength: 32
    OnboardingMissingSymbol:
      type: object
      additionalProperties: false
      required:
        - required_artifact
        - module
        - architecture
        - debug_id
        - code_id
      properties:
        required_artifact:
          type: string
          enum:
            - pe
            - pdb
        module:
          type: string
          maxLength: 256
        architecture:
          type: string
