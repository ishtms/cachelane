  /api/v1/projects/{project_id}/issues:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectIssues
      summary: List bounded project issues in stable last-seen order
      security:
        - bootstrapAuthorization: []
        - sessionAuthorization: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2048
          description: Opaque cursor returned by the previous page for the same project and filters.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/IssueStatus"
        - name: regression_state
          in: query
          schema:
            $ref: "#/components/schemas/IssueRegressionState"
        - name: release_id
          in: query
          schema:
            type: string
            format: uuid
        - name: crash_type
          in: query
          schema:
            type: string
            maxLength: 64
        - name: platform
          in: query
          schema:
            type: string
            maxLength: 64
        - name: architecture
          in: query
          schema:
            type: string
            maxLength: 64
        - name: engine_version
          in: query
          schema:
            type: string
            maxLength: 128
        - name: symbolication_state
          in: query
          schema:
            $ref: "#/components/schemas/SymbolicationState"
        - name: context_key
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9_.-]+$
          description: Owner-approved GameData key. Must be paired with context_value.
        - name: context_value
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 512
          description: Exact redacted GameData facet value. Must be paired with context_key.
        - name: first_seen_from
          in: query
          schema:
            type: string
            format: date-time
        - name: first_seen_to
          in: query
          schema:
            type: string
            format: date-time
        - name: last_seen_from
          in: query
          schema:
            type: string
            format: date-time
        - name: last_seen_to
          in: query
          schema:
            type: string
            format: date-time
        - name: query
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 120
          description: Case-insensitive token search across issue titles, functions, modules, messages, and comments. Punctuation separates tokens and every token must match.
      responses:
        "200":
          description: Bounded issue page
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueList"
        "400":
          $ref: "#/components/responses/IssueInvalidRequest"
        "404":
