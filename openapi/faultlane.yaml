  /u/{key}:
    servers:
      - url: http://127.0.0.1:8081
        description: Local ingest development
    parameters:
      - name: key
        in: path
        required: true
        description: Write-only project ingest key
        schema:
          type: string
          pattern: ^clpk_[a-f0-9]{64}$
    post:
      operationId: submitCrashReport
      summary: Store and queue one bounded UE 5.8 crash request
      parameters:
        - name: AppID
          in: query
          schema:
            type: string
        - name: AppVersion
          in: query
          schema:
            type: string
        - name: AppEnvironment
          in: query
          schema:
            type: string
        - name: UploadType
          in: query
          required: true
          schema:
            type: string
            const: crashreports
        - name: UserID
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Raw request and processing job are durable
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedCrash"
        "400":
          $ref: "#/components/responses/InvalidCrashRequest"
        "404":
          $ref: "#/components/responses/IngestNotFound"
        "413":
          $ref: "#/components/responses/CrashRequestTooLarge"
        "429":
          description: Project or source rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
                const: 60
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestError"
        "500":
          $ref: "#/components/responses/IngestInternalError"
        "503":
          $ref: "#/components/responses/IngestUnavailable"
components:
  securitySchemes:
    bootstrapAuthorization:
      type: apiKey
      in: header
      name: Authorization
      description: Loopback-only Authorization header using the value Bootstrap followed by the configured secret.
    sessionAuthorization:
      type: apiKey
      in: header
      name: Authorization
      description: Authorization header using Session followed by the hosted session token.
    artifactUploadToken:
      type: http
      scheme: bearer
      bearerFormat: FaultLane artifact upload token
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IngestKeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadTokenId:
      name: token_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReleaseId:
      name: release_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IssueId:
      name: issue_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: event_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReprocessingRequestId:
      name: request_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: session_id
      in: path
      required: true
