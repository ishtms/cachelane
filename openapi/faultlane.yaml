          type: string
          enum:
            - already_present
            - upload_required
            - identity_mismatch
        upload:
          $ref: "#/components/schemas/ArtifactUploadState"
        correction:
          type: string
    ReleaseCoverage:
      type: object
      additionalProperties: false
      required:
        - total
        - available
        - missing
        - mismatch
        - processing
        - quarantined
        - ready
      properties:
        total:
          type: integer
          minimum: 0
        available:
          type: integer
          minimum: 0
        missing:
          type: integer
          minimum: 0
        mismatch:
          type: integer
          minimum: 0
        processing:
          type: integer
          minimum: 0
        quarantined:
          type: integer
          minimum: 0
        ready:
          type: boolean
    NegotiatedArtifactUploads:
      type: object
      additionalProperties: false
      required:
        - release
        - artifacts
        - coverage
      properties:
        release:
          $ref: "#/components/schemas/ReleaseView"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/NegotiatedArtifact"
        coverage:
          $ref: "#/components/schemas/ReleaseCoverage"
    SignArtifactPart:
      type: object
      additionalProperties: false
      required:
        - part_number
        - byte_size
        - content_md5
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        byte_size:
          type: integer
          minimum: 1
        content_md5:
          type: string
    SignedArtifactPart:
      type: object
      additionalProperties: false
      required:
        - method
        - url
        - headers
        - expires_in_seconds
      properties:
        method:
          type: string
          const: PUT
        url:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
        expires_in_seconds:
          type: integer
          const: 600
    RecordArtifactPart:
      type: object
      additionalProperties: false
      required:
        - etag
        - byte_size
        - content_md5
      properties:
        etag:
          type: string
          minLength: 1
          maxLength: 128
        byte_size:
          type: integer
          minimum: 1
        content_md5:
          type: string
    CompletedArtifactUpload:
      type: object
      additionalProperties: false
      required:
        - release_id
        - artifact_status
        - coverage
      properties:
        release_id:
          type: string
          format: uuid
        artifact_status:
          type: string
          enum:
            - processing
            - available
        coverage:
          $ref: "#/components/schemas/ReleaseCoverage"
    ReleaseCoverageResponse:
      type: object
      additionalProperties: false
      required:
        - release
        - coverage
      properties:
        release:
          $ref: "#/components/schemas/ReleaseView"
        coverage:
          $ref: "#/components/schemas/ReleaseCoverage"
    UploadError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
    IngestError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
