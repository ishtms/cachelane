openapi: 3.1.1
info:
  title: FaultLane API
  version: 0.1.0
  description: Versioned control, setup, crash ingest, and health contract for FaultLane.
servers:
  - url: http://127.0.0.1:8080
    description: Local API development
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Report whether the process is alive
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Report whether the role can receive work
      responses:
        "200":
          description: Role is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/health:
    get:
      operationId: getApiHealth
      summary: Report API health through the versioned namespace
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/setup:
    post:
      operationId: createInitialProject
      summary: Create the first owner, organization, project, and ingest key
      description: Available only when loopback bootstrap authentication is explicitly enabled. The raw ingest key is returned once.
      security:
        - bootstrapAuthorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSetupRequest"
      responses:
        "201":
          description: Initial project created
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedSetup"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Initial setup is already complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/projects/{project_id}/setup:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectSetup
      summary: Get setup details without raw ingest keys
      security:
        - bootstrapAuthorization: []
      responses:
        "200":
          description: Project setup details
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - setup
                properties:
                  setup:
                    $ref: "#/components/schemas/ProjectSetup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{project_id}/ingest-keys:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createProjectIngestKey
      summary: Create another write-only ingest key
      description: The raw ingest key is returned once.
      security:
        - bootstrapAuthorization: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestKeyPolicy"
      responses:
        "201":
          description: Ingest key created
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedSetup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{project_id}/ingest-keys/{key_id}/policy:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IngestKeyId"
    patch:
      operationId: updateProjectIngestKeyPolicy
      summary: Update one ingest key environment and source allowlist
      security:
        - bootstrapAuthorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestKeyPolicy"
      responses:
        "200":
          description: Ingest key policy updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - setup
                properties:
                  setup:
                    $ref: "#/components/schemas/ProjectSetup"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{project_id}/ingest-keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IngestKeyId"
    delete:
      operationId: revokeProjectIngestKey
      summary: Revoke a project ingest key
      security:
        - bootstrapAuthorization: []
      responses:
        "204":
          description: Ingest key revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{project_id}/events/{event_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCrashEventState
      summary: Get one project-scoped crash processing state
      security:
        - bootstrapAuthorization: []
      responses:
        "200":
          description: Current crash processing state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventState"
        "404":
          $ref: "#/components/responses/IngestNotFound"
        "500":
          $ref: "#/components/responses/IngestInternalError"
  /api/v1/projects/{project_id}/issues:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectIssues
      summary: List bounded project issues in stable last-seen order
      security:
        - bootstrapAuthorization: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            format: uuid
          description: Issue ID returned as next_cursor by the previous page.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/IssueStatus"
        - name: regression_state
          in: query
          schema:
            $ref: "#/components/schemas/IssueRegressionState"
        - name: release_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bounded issue page
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueList"
        "400":
          $ref: "#/components/responses/IssueInvalidRequest"
        "404":
          $ref: "#/components/responses/IssueNotFound"
        "500":
          $ref: "#/components/responses/IssueInternalError"
  /api/v1/projects/{project_id}/issues/{issue_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IssueId"
    get:
      operationId: getProjectIssue
      summary: Get bounded issue details, variants, and affected releases
      security:
        - bootstrapAuthorization: []
      responses:
        "200":
          description: Issue details
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueDetail"
        "404":
          $ref: "#/components/responses/IssueNotFound"
        "500":
          $ref: "#/components/responses/IssueInternalError"
  /api/v1/projects/{project_id}/issues/{issue_id}/resolution:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IssueId"
    put:
      operationId: resolveProjectIssue
      summary: Resolve an issue against one ordered project release
      security:
        - bootstrapAuthorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveIssueRequest"
      responses:
        "200":
          description: Issue resolution state
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueResolution"
        "400":
          $ref: "#/components/responses/IssueInvalidRequest"
        "404":
          $ref: "#/components/responses/IssueNotFound"
        "500":
          $ref: "#/components/responses/IssueInternalError"
    delete:
      operationId: reopenProjectIssue
      summary: Reopen an issue and recalculate its retained release state
      security:
        - bootstrapAuthorization: []
      responses:
        "200":
          description: Reopened issue state
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueResolution"
        "404":
          $ref: "#/components/responses/IssueNotFound"
        "500":
          $ref: "#/components/responses/IssueInternalError"
  /api/v1/projects/{project_id}/reprocessing:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createProjectReprocessingRequest
      summary: Start one bounded project reprocessing request
      security:
        - bootstrapAuthorization: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[!-~]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReprocessingRequest"
      responses:
        "202":
          description: Reprocessing request accepted or replayed idempotently
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReprocessingRequest"
        "400":
          $ref: "#/components/responses/ReprocessingInvalidRequest"
        "404":
          $ref: "#/components/responses/ReprocessingNotFound"
        "409":
          $ref: "#/components/responses/ReprocessingConflict"
        "429":
          $ref: "#/components/responses/ReprocessingLimitReached"
        "500":
          $ref: "#/components/responses/ReprocessingInternalError"
  /api/v1/projects/{project_id}/reprocessing/{request_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ReprocessingRequestId"
    get:
      operationId: getProjectReprocessingRequest
      summary: Get bounded reprocessing progress and failure counts
      security:
        - bootstrapAuthorization: []
      responses:
        "200":
          description: Current reprocessing request progress
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReprocessingRequest"
        "404":
          $ref: "#/components/responses/ReprocessingNotFound"
        "500":
          $ref: "#/components/responses/ReprocessingInternalError"
  /api/v1/projects/{project_id}/artifact-upload-tokens:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createArtifactUploadToken
      summary: Create a project-scoped artifact upload token
      description: The raw token is returned once and only its SHA-256 digest is stored.
      security:
        - bootstrapAuthorization: []
      responses:
        "201":
          description: Artifact upload token created
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedArtifactUploadToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/UploadUnavailable"
  /api/v1/projects/{project_id}/artifact-upload-tokens/{token_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UploadTokenId"
    delete:
      operationId: revokeArtifactUploadToken
      summary: Revoke a project-scoped artifact upload token
      security:
        - bootstrapAuthorization: []
      responses:
        "204":
          description: Artifact upload token revoked
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/UploadUnavailable"
  /api/v1/projects/{project_slug}/artifact-uploads:
    parameters:
      - name: project_slug
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Slug"
    post:
      operationId: negotiateArtifactUploads
      summary: Create or update a release manifest and return only missing uploads
      security:
        - artifactUploadToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NegotiateArtifactUploads"
      responses:
        "200":
          description: Release manifest and resumable upload state
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NegotiatedArtifactUploads"
        "400":
          $ref: "#/components/responses/InvalidUploadRequest"
        "401":
          $ref: "#/components/responses/UploadUnauthorized"
        "404":
          $ref: "#/components/responses/UploadNotFound"
        "409":
          $ref: "#/components/responses/UploadConflict"
        "503":
          $ref: "#/components/responses/UploadUnavailable"
  /api/v1/artifact-uploads/{upload_id}/parts:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      operationId: signArtifactUploadPart
      summary: Sign one exact R2 or MinIO multipart part
      security:
        - artifactUploadToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignArtifactPart"
      responses:
        "200":
          description: Short-lived direct upload request
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedArtifactPart"
        "400":
          $ref: "#/components/responses/InvalidUploadRequest"
        "401":
          $ref: "#/components/responses/UploadUnauthorized"
        "404":
          $ref: "#/components/responses/UploadNotFound"
        "503":
          $ref: "#/components/responses/UploadUnavailable"
  /api/v1/artifact-uploads/{upload_id}/parts/{part_number}:
    parameters:
      - $ref: "#/components/parameters/UploadId"
      - name: part_number
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 10000
    patch:
      operationId: recordArtifactUploadPart
      summary: Verify and record a completed multipart part
      security:
        - artifactUploadToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordArtifactPart"
      responses:
        "204":
          description: Completed part recorded
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
        "400":
          $ref: "#/components/responses/InvalidUploadRequest"
        "401":
          $ref: "#/components/responses/UploadUnauthorized"
        "404":
          $ref: "#/components/responses/UploadNotFound"
        "409":
          $ref: "#/components/responses/UploadConflict"
        "503":
          $ref: "#/components/responses/UploadUnavailable"
  /api/v1/artifact-uploads/{upload_id}/complete:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      operationId: completeArtifactUpload
      summary: Complete one artifact upload and queue isolated indexing
      security:
        - artifactUploadToken: []
      responses:
        "200":
          description: Artifact accepted for isolated indexing
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletedArtifactUpload"
        "401":
          $ref: "#/components/responses/UploadUnauthorized"
        "404":
          $ref: "#/components/responses/UploadNotFound"
        "409":
          $ref: "#/components/responses/UploadConflict"
        "422":
          $ref: "#/components/responses/UploadMismatch"
        "503":
          $ref: "#/components/responses/UploadUnavailable"
  /api/v1/releases/{release_id}/coverage:
    parameters:
      - $ref: "#/components/parameters/ReleaseId"
    get:
      operationId: getReleaseArtifactCoverage
      summary: Get deterministic artifact coverage for one scoped release
      security:
        - artifactUploadToken: []
      responses:
        "200":
          description: Current release artifact coverage
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseCoverageResponse"
        "401":
          $ref: "#/components/responses/UploadUnauthorized"
        "404":
          $ref: "#/components/responses/UploadNotFound"
        "503":
          $ref: "#/components/responses/UploadUnavailable"
  /u/{key}:
    servers:
      - url: http://127.0.0.1:8081
        description: Local ingest development
    parameters:
      - name: key
        in: path
        required: true
        description: Write-only project ingest key
        schema:
          type: string
          pattern: ^clpk_[a-f0-9]{64}$
    post:
      operationId: submitCrashReport
      summary: Store and queue one bounded UE 5.8 crash request
      parameters:
        - name: AppID
          in: query
          schema:
            type: string
        - name: AppVersion
          in: query
          schema:
            type: string
        - name: AppEnvironment
          in: query
          schema:
            type: string
        - name: UploadType
          in: query
          required: true
          schema:
            type: string
            const: crashreports
        - name: UserID
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Raw request and processing job are durable
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedCrash"
        "400":
          $ref: "#/components/responses/InvalidCrashRequest"
        "404":
          $ref: "#/components/responses/IngestNotFound"
        "413":
          $ref: "#/components/responses/CrashRequestTooLarge"
        "429":
          description: Project or source rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
                const: 60
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestError"
        "500":
          $ref: "#/components/responses/IngestInternalError"
        "503":
          $ref: "#/components/responses/IngestUnavailable"
components:
  securitySchemes:
    bootstrapAuthorization:
      type: apiKey
      in: header
      name: Authorization
      description: Loopback-only Authorization header using the value Bootstrap followed by the configured secret.
    artifactUploadToken:
      type: http
      scheme: bearer
      bearerFormat: FaultLane artifact upload token
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IngestKeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadTokenId:
      name: token_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReleaseId:
      name: release_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IssueId:
      name: issue_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReprocessingRequestId:
      name: request_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    CacheControlNoStore:
      description: Prevent storage of sensitive control and artifact metadata responses.
      schema:
        type: string
        const: no-store
    RateLimitLimit:
      description: The tighter applicable request limit.
      schema:
        type: integer
        minimum: 1
    RateLimitRemaining:
      description: Requests remaining in the current fixed window.
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: Seconds until the fixed window resets.
      schema:
        type: integer
        const: 60
  responses:
    InvalidRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Bootstrap authorization is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource is unavailable or outside the caller's organization
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidCrashRequest:
      description: Crash request transport or envelope validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestError"
    IngestNotFound:
      description: The ingest resource is unavailable or the event is outside the caller's scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestError"
    CrashRequestTooLarge:
      description: Crash request exceeded a configured resource limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestError"
    IngestInternalError:
      description: Crash request could not be completed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestError"
    IngestUnavailable:
      description: Crash ingestion is temporarily unavailable
      content:
        application/json:
              schema:
                $ref: "#/components/schemas/IngestError"
    InvalidUploadRequest:
      description: Artifact upload request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadError"
    UploadUnauthorized:
      description: Artifact upload token is missing, malformed, revoked, or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadError"
    UploadNotFound:
      description: The resource is absent or outside the upload token's project
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadError"
    UploadConflict:
      description: Multipart upload state changed and should be renegotiated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadError"
    UploadMismatch:
      description: The stored bytes do not match the declared checksum and embedded identity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadError"
    UploadUnavailable:
      description: PostgreSQL or object storage is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadError"
    IssueInvalidRequest:
      description: Issue request validation failed
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IssueNotFound:
      description: The issue resource is unavailable or outside the caller's organization
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IssueInternalError:
      description: Issue request could not be completed
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReprocessingInvalidRequest:
      description: Reprocessing request validation failed
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReprocessingNotFound:
      description: The request is unavailable, disabled, unauthorized, or outside the project
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReprocessingConflict:
      description: The idempotency key was used with another request body
      headers:
