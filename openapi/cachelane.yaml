openapi: 3.1.1
info:
  title: CacheLane API
  version: 0.1.0
  description: Versioned control, setup, crash ingest, and health contract for CacheLane.
servers:
  - url: http://127.0.0.1:8080
    description: Local API development
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Report whether the process is alive
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Report whether the role can receive work
      responses:
        "200":
          description: Role is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/health:
    get:
      operationId: getApiHealth
      summary: Report API health through the versioned namespace
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/setup:
    post:
      operationId: createInitialProject
      summary: Create the first owner, organization, project, and ingest key
      description: Available only when loopback bootstrap authentication is explicitly enabled. The raw ingest key is returned once.
      security:
        - bootstrapAuthorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSetupRequest"
      responses:
        "201":
          description: Initial project created
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedSetup"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Initial setup is already complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/projects/{project_id}/setup:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectSetup
      summary: Get setup details without raw ingest keys
      security:
        - bootstrapAuthorization: []
      responses:
        "200":
          description: Project setup details
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - setup
                properties:
                  setup:
                    $ref: "#/components/schemas/ProjectSetup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{project_id}/ingest-keys:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createProjectIngestKey
      summary: Create another write-only ingest key
      description: The raw ingest key is returned once.
      security:
        - bootstrapAuthorization: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestKeyPolicy"
      responses:
        "201":
          description: Ingest key created
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedSetup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{project_id}/ingest-keys/{key_id}/policy:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IngestKeyId"
    patch:
      operationId: updateProjectIngestKeyPolicy
      summary: Update one ingest key environment and source allowlist
      security:
        - bootstrapAuthorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestKeyPolicy"
      responses:
        "200":
          description: Ingest key policy updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - setup
                properties:
                  setup:
                    $ref: "#/components/schemas/ProjectSetup"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{project_id}/ingest-keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IngestKeyId"
    delete:
      operationId: revokeProjectIngestKey
      summary: Revoke a project ingest key
      security:
        - bootstrapAuthorization: []
      responses:
        "204":
          description: Ingest key revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{project_id}/events/{event_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCrashEventState
      summary: Get one project-scoped crash processing state
      security:
        - bootstrapAuthorization: []
      responses:
        "200":
          description: Current crash processing state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventState"
        "404":
          $ref: "#/components/responses/IngestNotFound"
        "500":
          $ref: "#/components/responses/IngestInternalError"
  /u/{key}:
    servers:
      - url: http://127.0.0.1:8081
        description: Local ingest development
    parameters:
      - name: key
        in: path
        required: true
        description: Write-only project ingest key
        schema:
          type: string
          pattern: ^clpk_[a-f0-9]{64}$
    post:
      operationId: submitCrashReport
      summary: Store and queue one bounded UE 5.8 crash request
      parameters:
        - name: AppID
          in: query
          schema:
            type: string
        - name: AppVersion
          in: query
          schema:
            type: string
        - name: AppEnvironment
          in: query
          schema:
            type: string
        - name: UploadType
          in: query
          required: true
          schema:
            type: string
            const: crashreports
        - name: UserID
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Raw request and processing job are durable
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedCrash"
        "400":
          $ref: "#/components/responses/InvalidCrashRequest"
        "404":
          $ref: "#/components/responses/IngestNotFound"
        "413":
          $ref: "#/components/responses/CrashRequestTooLarge"
        "429":
          description: Project or source rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
                const: 60
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestError"
        "500":
          $ref: "#/components/responses/IngestInternalError"
        "503":
          $ref: "#/components/responses/IngestUnavailable"
components:
  securitySchemes:
    bootstrapAuthorization:
      type: apiKey
      in: header
      name: Authorization
      description: Loopback-only Authorization header using the value Bootstrap followed by the configured secret.
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IngestKeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    RateLimitLimit:
      description: The tighter applicable request limit.
      schema:
        type: integer
        minimum: 1
    RateLimitRemaining:
      description: Requests remaining in the current fixed window.
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: Seconds until the fixed window resets.
      schema:
        type: integer
        const: 60
  responses:
    InvalidRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Bootstrap authorization is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource is unavailable or outside the caller's organization
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidCrashRequest:
      description: Crash request transport or envelope validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestError"
    IngestNotFound:
      description: The ingest resource is unavailable or the event is outside the caller's scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestError"
    CrashRequestTooLarge:
      description: Crash request exceeded a configured resource limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestError"
    IngestInternalError:
      description: Crash request could not be completed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestError"
    IngestUnavailable:
      description: Crash ingestion is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestError"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - role
        - service
        - status
        - version
      properties:
        role:
          type: string
        service:
          type: string
          const: cachelane-server
        status:
          type: string
          const: ok
        version:
          type: string
    CreateSetupRequest:
      type: object
      additionalProperties: false
      required:
        - owner_email
        - organization_name
        - organization_slug
        - project_name
        - project_slug
      properties:
        owner_email:
          type: string
          format: email
          maxLength: 254
        organization_name:
          type: string
          minLength: 1
          maxLength: 80
        organization_slug:
          $ref: "#/components/schemas/Slug"
        project_name:
          type: string
          minLength: 1
          maxLength: 80
        project_slug:
          $ref: "#/components/schemas/Slug"
    Slug:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    Organization:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    IngestKey:
      type: object
      additionalProperties: false
      required:
        - id
        - display_suffix
        - environment
        - allowed_cidrs
        - created_at
        - revoked_at
      properties:
        id:
          type: string
          format: uuid
        display_suffix:
          type: string
          pattern: ^[a-f0-9]{8}$
        environment:
          $ref: "#/components/schemas/Environment"
        allowed_cidrs:
          type: array
          maxItems: 32
          items:
            type: string
            description: IPv4 or IPv6 CIDR
        created_at:
          type: string
          format: date-time
        revoked_at:
          type:
            - string
            - "null"
          format: date-time
    Environment:
      type: string
      minLength: 1
      maxLength: 32
      pattern: ^[a-z0-9][a-z0-9-]{0,31}$
    IngestKeyPolicy:
      type: object
      additionalProperties: false
      required:
        - environment
      properties:
        environment:
          $ref: "#/components/schemas/Environment"
        allowed_cidrs:
          type: array
          maxItems: 32
          default: []
          items:
            type: string
            description: IPv4 or IPv6 CIDR
    ProjectSetup:
      type: object
      additionalProperties: false
      required:
        - owner_id
        - organization
        - project
        - ingest_keys
      properties:
        owner_id:
          type: string
          format: uuid
        organization:
          $ref: "#/components/schemas/Organization"
        project:
          $ref: "#/components/schemas/Project"
        ingest_keys:
          type: array
          items:
            $ref: "#/components/schemas/IngestKey"
    SecretIngestKey:
      type: object
      additionalProperties: false
      required:
        - id
        - value
        - display_suffix
      properties:
        id:
          type: string
          format: uuid
        value:
          type: string
          pattern: ^clpk_[a-f0-9]{64}$
          readOnly: true
          description: Write-only credential value returned only when the key is created.
        display_suffix:
          type: string
          pattern: ^[a-f0-9]{8}$
    UnrealConfiguration:
      type: object
      additionalProperties: false
      required:
        - default_game_ini_path
        - default_game_ini
        - default_engine_ini_path
        - default_engine_ini
      properties:
        default_game_ini_path:
          type: string
        default_game_ini:
          type: string
        default_engine_ini_path:
          type: string
        default_engine_ini:
          type: string
    CreatedSetup:
      type: object
      additionalProperties: false
      required:
        - setup
        - ingest_key
        - data_router_url
        - configuration
      properties:
        setup:
          $ref: "#/components/schemas/ProjectSetup"
        ingest_key:
          $ref: "#/components/schemas/SecretIngestKey"
        data_router_url:
          type: string
          format: uri
        configuration:
          $ref: "#/components/schemas/UnrealConfiguration"
    AcceptedCrash:
      type: object
      additionalProperties: false
      required:
        - event_id
        - state
        - deduplicated
        - received_at
        - status_path
      properties:
        event_id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/ProcessingState"
        deduplicated:
          type: boolean
        received_at:
          type: string
          format: date-time
        status_path:
          type: string
    ProcessingState:
      type: string
      enum:
        - received
        - stored
        - parsed
        - awaiting_symbols
        - symbolicating
        - processed
        - failed
        - quarantined
    EventState:
      type: object
      additionalProperties: false
      required:
        - event_id
        - project_id
        - environment
        - crash_guid
        - state
        - reason
        - retryable
        - retry_at
        - received_at
        - updated_at
      properties:
        event_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        environment:
          $ref: "#/components/schemas/Environment"
        crash_guid:
          type:
            - string
            - "null"
        state:
          $ref: "#/components/schemas/ProcessingState"
        reason:
          type:
            - string
            - "null"
          pattern: ^[a-z0-9][a-z0-9_]{0,63}$
        retryable:
          type: boolean
        retry_at:
          type:
            - string
            - "null"
          format: date-time
        received_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IngestError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
