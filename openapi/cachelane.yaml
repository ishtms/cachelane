openapi: 3.1.1
info:
  title: CacheLane API
  version: 0.1.0
  description: Versioned control, setup, crash ingest, and health contract for CacheLane.
servers:
  - url: http://127.0.0.1:8080
    description: Local API development
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Report whether the process is alive
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Report whether the role can receive work
      responses:
        "200":
          description: Role is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/health:
    get:
      operationId: getApiHealth
      summary: Report API health through the versioned namespace
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/setup:
    post:
      operationId: createInitialProject
      summary: Create the first owner, organization, project, and ingest key
      description: Available only when loopback bootstrap authentication is explicitly enabled. The raw ingest key is returned once.
      security:
        - bootstrapAuthorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSetupRequest"
      responses:
        "201":
          description: Initial project created
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedSetup"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Initial setup is already complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/projects/{project_id}/setup:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectSetup
      summary: Get setup details without raw ingest keys
      security:
        - bootstrapAuthorization: []
      responses:
        "200":
          description: Project setup details
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - setup
                properties:
                  setup:
                    $ref: "#/components/schemas/ProjectSetup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{project_id}/ingest-keys:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createProjectIngestKey
      summary: Create another write-only ingest key
      description: The raw ingest key is returned once.
      security:
        - bootstrapAuthorization: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestKeyPolicy"
      responses:
        "201":
          description: Ingest key created
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedSetup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{project_id}/ingest-keys/{key_id}/policy:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IngestKeyId"
    patch:
      operationId: updateProjectIngestKeyPolicy
      summary: Update one ingest key environment and source allowlist
      security:
        - bootstrapAuthorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestKeyPolicy"
      responses:
        "200":
          description: Ingest key policy updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - setup
                properties:
                  setup:
                    $ref: "#/components/schemas/ProjectSetup"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{project_id}/ingest-keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IngestKeyId"
    delete:
      operationId: revokeProjectIngestKey
      summary: Revoke a project ingest key
      security:
        - bootstrapAuthorization: []
      responses:
        "204":
          description: Ingest key revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{project_id}/events/{event_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCrashEventState
      summary: Get one project-scoped crash processing state
      security:
        - bootstrapAuthorization: []
      responses:
        "200":
          description: Current crash processing state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventState"
        "404":
          $ref: "#/components/responses/IngestNotFound"
        "500":
          $ref: "#/components/responses/IngestInternalError"
  /api/v1/projects/{project_id}/artifact-upload-tokens:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createArtifactUploadToken
      summary: Create a project-scoped artifact upload token
      description: The raw token is returned once and only its SHA-256 digest is stored.
      security:
        - bootstrapAuthorization: []
      responses:
        "201":
          description: Artifact upload token created
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedArtifactUploadToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/UploadUnavailable"
  /api/v1/projects/{project_id}/artifact-upload-tokens/{token_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UploadTokenId"
    delete:
      operationId: revokeArtifactUploadToken
      summary: Revoke a project-scoped artifact upload token
      security:
        - bootstrapAuthorization: []
      responses:
        "204":
          description: Artifact upload token revoked
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/UploadUnavailable"
  /api/v1/projects/{project_slug}/artifact-uploads:
    parameters:
      - name: project_slug
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Slug"
    post:
      operationId: negotiateArtifactUploads
      summary: Create or update a release manifest and return only missing uploads
      security:
        - artifactUploadToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NegotiateArtifactUploads"
      responses:
        "200":
          description: Release manifest and resumable upload state
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NegotiatedArtifactUploads"
        "400":
          $ref: "#/components/responses/InvalidUploadRequest"
        "401":
          $ref: "#/components/responses/UploadUnauthorized"
        "404":
          $ref: "#/components/responses/UploadNotFound"
        "409":
          $ref: "#/components/responses/UploadConflict"
        "503":
          $ref: "#/components/responses/UploadUnavailable"
  /api/v1/artifact-uploads/{upload_id}/parts:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      operationId: signArtifactUploadPart
      summary: Sign one exact R2 or MinIO multipart part
      security:
        - artifactUploadToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignArtifactPart"
      responses:
        "200":
          description: Short-lived direct upload request
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedArtifactPart"
        "400":
          $ref: "#/components/responses/InvalidUploadRequest"
        "401":
          $ref: "#/components/responses/UploadUnauthorized"
        "404":
          $ref: "#/components/responses/UploadNotFound"
        "503":
          $ref: "#/components/responses/UploadUnavailable"
  /api/v1/artifact-uploads/{upload_id}/parts/{part_number}:
    parameters:
      - $ref: "#/components/parameters/UploadId"
      - name: part_number
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 10000
    patch:
      operationId: recordArtifactUploadPart
      summary: Verify and record a completed multipart part
      security:
        - artifactUploadToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordArtifactPart"
      responses:
        "204":
          description: Completed part recorded
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
        "400":
          $ref: "#/components/responses/InvalidUploadRequest"
        "401":
          $ref: "#/components/responses/UploadUnauthorized"
        "404":
          $ref: "#/components/responses/UploadNotFound"
        "409":
          $ref: "#/components/responses/UploadConflict"
        "503":
          $ref: "#/components/responses/UploadUnavailable"
  /api/v1/artifact-uploads/{upload_id}/complete:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      operationId: completeArtifactUpload
      summary: Complete, verify, and publish one artifact upload
      security:
        - artifactUploadToken: []
      responses:
        "200":
          description: Artifact published and release coverage updated
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletedArtifactUpload"
        "401":
          $ref: "#/components/responses/UploadUnauthorized"
        "404":
          $ref: "#/components/responses/UploadNotFound"
        "409":
          $ref: "#/components/responses/UploadConflict"
        "422":
          $ref: "#/components/responses/UploadMismatch"
        "503":
          $ref: "#/components/responses/UploadUnavailable"
  /api/v1/releases/{release_id}/coverage:
    parameters:
      - $ref: "#/components/parameters/ReleaseId"
    get:
      operationId: getReleaseArtifactCoverage
      summary: Get deterministic artifact coverage for one scoped release
      security:
        - artifactUploadToken: []
      responses:
        "200":
          description: Current release artifact coverage
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseCoverageResponse"
        "401":
          $ref: "#/components/responses/UploadUnauthorized"
        "404":
          $ref: "#/components/responses/UploadNotFound"
        "503":
          $ref: "#/components/responses/UploadUnavailable"
  /u/{key}:
    servers:
      - url: http://127.0.0.1:8081
        description: Local ingest development
    parameters:
      - name: key
        in: path
        required: true
        description: Write-only project ingest key
        schema:
          type: string
          pattern: ^clpk_[a-f0-9]{64}$
    post:
      operationId: submitCrashReport
      summary: Store and queue one bounded UE 5.8 crash request
      parameters:
        - name: AppID
          in: query
          schema:
            type: string
        - name: AppVersion
          in: query
          schema:
            type: string
        - name: AppEnvironment
          in: query
          schema:
            type: string
        - name: UploadType
          in: query
          required: true
          schema:
            type: string
            const: crashreports
        - name: UserID
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Raw request and processing job are durable
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedCrash"
        "400":
          $ref: "#/components/responses/InvalidCrashRequest"
        "404":
          $ref: "#/components/responses/IngestNotFound"
        "413":
          $ref: "#/components/responses/CrashRequestTooLarge"
        "429":
          description: Project or source rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
                const: 60
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestError"
        "500":
          $ref: "#/components/responses/IngestInternalError"
        "503":
          $ref: "#/components/responses/IngestUnavailable"
components:
  securitySchemes:
    bootstrapAuthorization:
      type: apiKey
      in: header
      name: Authorization
      description: Loopback-only Authorization header using the value Bootstrap followed by the configured secret.
    artifactUploadToken:
      type: http
      scheme: bearer
      bearerFormat: CacheLane artifact upload token
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IngestKeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadTokenId:
      name: token_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReleaseId:
      name: release_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    CacheControlNoStore:
      description: Prevent storage of credential and artifact metadata responses.
      schema:
        type: string
        const: no-store
    RateLimitLimit:
      description: The tighter applicable request limit.
      schema:
        type: integer
        minimum: 1
    RateLimitRemaining:
      description: Requests remaining in the current fixed window.
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: Seconds until the fixed window resets.
      schema:
        type: integer
        const: 60
  responses:
    InvalidRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Bootstrap authorization is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource is unavailable or outside the caller's organization
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidCrashRequest:
      description: Crash request transport or envelope validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestError"
    IngestNotFound:
      description: The ingest resource is unavailable or the event is outside the caller's scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestError"
    CrashRequestTooLarge:
      description: Crash request exceeded a configured resource limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestError"
    IngestInternalError:
      description: Crash request could not be completed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestError"
    IngestUnavailable:
      description: Crash ingestion is temporarily unavailable
      content:
        application/json:
              schema:
                $ref: "#/components/schemas/IngestError"
    InvalidUploadRequest:
      description: Artifact upload request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadError"
    UploadUnauthorized:
      description: Artifact upload token is missing, malformed, revoked, or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadError"
    UploadNotFound:
      description: The resource is absent or outside the upload token's project
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadError"
    UploadConflict:
      description: Multipart upload state changed and should be renegotiated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadError"
    UploadMismatch:
      description: The stored bytes do not match the declared checksum and embedded identity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadError"
    UploadUnavailable:
      description: PostgreSQL or object storage is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadError"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - role
        - service
        - status
        - version
      properties:
        role:
          type: string
        service:
          type: string
          const: cachelane-server
        status:
          type: string
          const: ok
        version:
          type: string
    CreateSetupRequest:
      type: object
      additionalProperties: false
      required:
        - owner_email
        - organization_name
        - organization_slug
        - project_name
        - project_slug
      properties:
        owner_email:
          type: string
          format: email
          maxLength: 254
        organization_name:
          type: string
          minLength: 1
          maxLength: 80
        organization_slug:
          $ref: "#/components/schemas/Slug"
        project_name:
          type: string
          minLength: 1
          maxLength: 80
        project_slug:
          $ref: "#/components/schemas/Slug"
    Slug:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    Organization:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    IngestKey:
      type: object
      additionalProperties: false
      required:
        - id
        - display_suffix
        - environment
        - allowed_cidrs
        - created_at
        - revoked_at
      properties:
        id:
          type: string
          format: uuid
        display_suffix:
          type: string
          pattern: ^[a-f0-9]{8}$
        environment:
          $ref: "#/components/schemas/Environment"
        allowed_cidrs:
          type: array
          maxItems: 32
          items:
            type: string
            description: IPv4 or IPv6 CIDR
        created_at:
          type: string
          format: date-time
        revoked_at:
          type:
            - string
            - "null"
          format: date-time
    Environment:
      type: string
      minLength: 1
      maxLength: 32
      pattern: ^[a-z0-9][a-z0-9-]{0,31}$
    IngestKeyPolicy:
      type: object
      additionalProperties: false
      required:
        - environment
      properties:
        environment:
          $ref: "#/components/schemas/Environment"
        allowed_cidrs:
          type: array
          maxItems: 32
          default: []
          items:
            type: string
            description: IPv4 or IPv6 CIDR
    ProjectSetup:
      type: object
      additionalProperties: false
      required:
        - owner_id
        - organization
        - project
        - ingest_keys
      properties:
        owner_id:
          type: string
          format: uuid
        organization:
          $ref: "#/components/schemas/Organization"
        project:
          $ref: "#/components/schemas/Project"
        ingest_keys:
          type: array
          items:
            $ref: "#/components/schemas/IngestKey"
    SecretIngestKey:
      type: object
      additionalProperties: false
      required:
        - id
        - value
        - display_suffix
      properties:
        id:
          type: string
          format: uuid
        value:
          type: string
          pattern: ^clpk_[a-f0-9]{64}$
          readOnly: true
          description: Write-only credential value returned only when the key is created.
        display_suffix:
          type: string
          pattern: ^[a-f0-9]{8}$
    UnrealConfiguration:
      type: object
      additionalProperties: false
      required:
        - default_game_ini_path
        - default_game_ini
        - default_engine_ini_path
        - default_engine_ini
      properties:
        default_game_ini_path:
          type: string
        default_game_ini:
          type: string
        default_engine_ini_path:
          type: string
        default_engine_ini:
          type: string
    CreatedSetup:
      type: object
      additionalProperties: false
      required:
        - setup
        - ingest_key
        - data_router_url
        - configuration
      properties:
        setup:
          $ref: "#/components/schemas/ProjectSetup"
        ingest_key:
          $ref: "#/components/schemas/SecretIngestKey"
        data_router_url:
          type: string
          format: uri
        configuration:
          $ref: "#/components/schemas/UnrealConfiguration"
    AcceptedCrash:
      type: object
      additionalProperties: false
      required:
        - event_id
        - state
        - deduplicated
        - received_at
        - status_path
      properties:
        event_id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/ProcessingState"
        deduplicated:
          type: boolean
        received_at:
          type: string
          format: date-time
        status_path:
          type: string
    ProcessingState:
      type: string
      enum:
        - received
        - stored
        - parsed
        - awaiting_symbols
        - symbolicating
        - processed
        - failed
        - quarantined
    EventState:
      type: object
      additionalProperties: false
      required:
        - event_id
        - project_id
        - environment
        - crash_guid
        - state
        - reason
        - retryable
        - retry_at
        - received_at
        - updated_at
      properties:
        event_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        environment:
          $ref: "#/components/schemas/Environment"
        crash_guid:
          type:
            - string
            - "null"
        state:
          $ref: "#/components/schemas/ProcessingState"
        reason:
          type:
            - string
            - "null"
          pattern: ^[a-z0-9][a-z0-9_]{0,63}$
        retryable:
          type: boolean
        retry_at:
          type:
            - string
            - "null"
          format: date-time
        received_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreatedArtifactUploadToken:
      type: object
      additionalProperties: false
      required:
        - id
        - project_id
        - token
        - display_suffix
        - created_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        token:
          type: string
          pattern: ^clsu_[a-f0-9]{64}$
          readOnly: true
        display_suffix:
          type: string
          pattern: ^[a-f0-9]{8}$
        created_at:
          type: string
          format: date-time
    ReleaseManifest:
      type: object
      additionalProperties: false
      required:
        - version
        - platform
        - architecture
        - configuration
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 128
        platform:
          type: string
          const: windows
        architecture:
          $ref: "#/components/schemas/WindowsArchitecture"
        configuration:
          type: string
          minLength: 1
          maxLength: 32
        revision:
          type:
            - string
            - "null"
          maxLength: 256
        channel:
          type:
            - string
            - "null"
          maxLength: 64
        build_timestamp:
          type:
            - string
            - "null"
          format: date-time
    ReleaseView:
      allOf:
        - $ref: "#/components/schemas/ReleaseManifest"
        - type: object
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
    WindowsArchitecture:
      type: string
      enum:
        - x86
        - x86_64
        - arm64
    ArtifactManifestEntry:
      type: object
      additionalProperties: false
      required:
        - path
        - module
        - artifact_type
        - architecture
        - byte_size
        - sha256
        - debug_id
        - code_id
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 512
          description: Scan-relative path with slash separators. Absolute and parent paths are rejected.
        module:
          type: string
          minLength: 1
          maxLength: 256
        artifact_type:
          type: string
          enum:
            - pe_executable
            - pe_dynamic_library
            - pdb
        architecture:
          $ref: "#/components/schemas/WindowsArchitecture"
        byte_size:
          type: integer
          minimum: 1
          maximum: 17179869184
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        debug_id:
          type: string
          minLength: 1
          maxLength: 128
        code_id:
          type:
            - string
            - "null"
          maxLength: 128
    NegotiateArtifactUploads:
      type: object
      additionalProperties: false
      required:
        - release
        - artifacts
        - cli_version
      properties:
        release:
          $ref: "#/components/schemas/ReleaseManifest"
        artifacts:
          type: array
          minItems: 1
          maxItems: 512
          items:
            $ref: "#/components/schemas/ArtifactManifestEntry"
        cli_version:
          type: string
          minLength: 1
          maxLength: 64
        ci_job:
          type:
            - string
            - "null"
          maxLength: 256
    CompletedPartState:
      type: object
      additionalProperties: false
      required:
        - part_number
        - byte_size
        - content_md5
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        byte_size:
          type: integer
          minimum: 1
        content_md5:
          type: string
          description: Base64-encoded 128-bit MD5 digest.
    ArtifactUploadState:
      type: object
      additionalProperties: false
      required:
        - id
        - part_size
        - part_count
        - completed_parts
      properties:
        id:
          type: string
          format: uuid
        part_size:
          type: integer
          minimum: 5242880
        part_count:
          type: integer
          minimum: 1
          maximum: 10000
        completed_parts:
          type: array
          items:
            $ref: "#/components/schemas/CompletedPartState"
    NegotiatedArtifact:
      type: object
      additionalProperties: false
      required:
        - path
        - sha256
        - status
      properties:
        path:
          type: string
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        status:
          type: string
          enum:
            - already_present
            - upload_required
            - identity_mismatch
        upload:
          $ref: "#/components/schemas/ArtifactUploadState"
        correction:
          type: string
    ReleaseCoverage:
      type: object
      additionalProperties: false
      required:
        - total
        - available
        - missing
        - mismatch
        - ready
      properties:
        total:
          type: integer
          minimum: 0
        available:
          type: integer
          minimum: 0
        missing:
          type: integer
          minimum: 0
        mismatch:
          type: integer
          minimum: 0
        ready:
          type: boolean
    NegotiatedArtifactUploads:
      type: object
      additionalProperties: false
      required:
        - release
        - artifacts
        - coverage
      properties:
        release:
          $ref: "#/components/schemas/ReleaseView"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/NegotiatedArtifact"
        coverage:
          $ref: "#/components/schemas/ReleaseCoverage"
    SignArtifactPart:
      type: object
      additionalProperties: false
      required:
        - part_number
        - byte_size
        - content_md5
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        byte_size:
          type: integer
          minimum: 1
        content_md5:
          type: string
    SignedArtifactPart:
      type: object
      additionalProperties: false
      required:
        - method
        - url
        - headers
        - expires_in_seconds
      properties:
        method:
          type: string
          const: PUT
        url:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
        expires_in_seconds:
          type: integer
          const: 600
    RecordArtifactPart:
      type: object
      additionalProperties: false
      required:
        - etag
        - byte_size
        - content_md5
      properties:
        etag:
          type: string
          minLength: 1
          maxLength: 128
        byte_size:
          type: integer
          minimum: 1
        content_md5:
          type: string
    CompletedArtifactUpload:
      type: object
      additionalProperties: false
      required:
        - release_id
        - artifact_status
        - coverage
      properties:
        release_id:
          type: string
          format: uuid
        artifact_status:
          type: string
          const: available
        coverage:
          $ref: "#/components/schemas/ReleaseCoverage"
    ReleaseCoverageResponse:
      type: object
      additionalProperties: false
      required:
        - release
        - coverage
      properties:
        release:
          $ref: "#/components/schemas/ReleaseView"
        coverage:
          $ref: "#/components/schemas/ReleaseCoverage"
    UploadError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
    IngestError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
