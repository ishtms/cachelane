[workspace]
members = ["apps/cli", "apps/server", "crates/domain", "crates/symbols", "crates/unreal"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
authors = ["Ishtmeet Singh"]
repository = "https://github.com/ishtms/cachelane"

[workspace.dependencies]
aws-sdk-s3 = { version = "1.141.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "http-1x", "rt-tokio"] }
axum = "0.8.9"
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
futures-util = "0.3.31"
getrandom = "0.4.3"
hmac = "0.13.0"
ipnet = "2.11.0"
md-5 = "0.11.0"
minidump = "=0.27.0"
minidump-processor = { version = "=0.27.0", default-features = false }
minidump-unwind = { version = "=0.27.0", features = ["debuginfo"] }
object = { version = "0.40.0", default-features = false, features = ["pe", "read_core", "std"] }
object_store = { version = "0.14.1", default-features = false, features = ["aws"] }
pdb = "0.8.0"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "time"] }
subtle = "2.6.1"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
