name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CACHELANE_TEST_DATABASE_URL: postgres://cachelane_296:cachelane_296_dev@127.0.0.1:5432/cachelane_296
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: cachelane_296
          POSTGRES_PASSWORD: cachelane_296_dev
          POSTGRES_USER: cachelane_296
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cachelane_296 -d cachelane_296"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - run: ./scripts/check

  windows-check:
    name: windows check
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: verify Rust host
        run: |
          rust_host="$(rustc -vV | sed -n 's/^host: //p')"
          echo "Rust host: $rust_host"
          test "$rust_host" = x86_64-pc-windows-msvc
      - run: ./scripts/check
