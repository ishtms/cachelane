name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FAULTLANE_TEST_DATABASE_URL: postgres://faultlane_test:faultlane_test_dev@127.0.0.1:5432/faultlane_test
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: faultlane_test
          POSTGRES_PASSWORD: faultlane_test_dev
          POSTGRES_USER: faultlane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faultlane_test -d faultlane_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: ./scripts/setup
      - run: ./scripts/check

  windows-check:
    name: windows check
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: ./scripts/setup
      - name: start Windows check services
        shell: pwsh
        run: ./.github/scripts/start-windows-check-services.ps1
      - name: verify Rust host
        run: |
          rust_host="$(rustc -vV | sed -n 's/^host: //p')"
          echo "Rust host: $rust_host"
          test "$rust_host" = x86_64-pc-windows-msvc
      - run: ./scripts/check
