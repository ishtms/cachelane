name: CI

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FAULTLANE_TEST_DATABASE_URL: postgres://faultlane_test:faultlane_test_dev@127.0.0.1:5432/faultlane_test
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: faultlane_test
          POSTGRES_PASSWORD: faultlane_test_dev
          POSTGRES_USER: faultlane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faultlane_test -d faultlane_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: ./scripts/setup
      - run: ./scripts/check-pr
        env:
          FAULTLANE_BASE_SHA: ${{ github.event.pull_request.base.sha }}

  windows-check:
    name: windows check
    if: github.event_name != 'schedule'
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: verify Rust host
        run: |
          rust_host="$(rustc -vV | sed -n 's/^host: //p')"
          echo "Rust host: $rust_host"
          test "$rust_host" = x86_64-pc-windows-msvc
      - run: cargo check --package faultlane-server --all-targets
      - run: cargo test --package faultlane-cli --package faultlane-symbols --package faultlane-unreal

  nightly:
    name: nightly certification
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FAULTLANE_TEST_DATABASE_URL: postgres://faultlane_test:faultlane_test_dev@127.0.0.1:5432/faultlane_test
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: faultlane_test
          POSTGRES_PASSWORD: faultlane_test_dev
          POSTGRES_USER: faultlane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faultlane_test -d faultlane_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: ./scripts/setup
      - run: ./scripts/check
