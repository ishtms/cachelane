name: Feature
description: Propose a focused FaultLane outcome
title: ""
labels:
  - feature
body:
  - type: textarea
    id: outcome
    attributes:
      label: Executable outcome
      description: State the result through a real command, API, UI, or runtime entrypoint.
      placeholder: When <actor or input> uses <entrypoint>, FaultLane now <new observable result>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List measurable behavior and important failure cases.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Proposed risk
      description: Classify by blast radius and reversibility.
      options:
        - R0: trivial
        - R1: normal
        - R2: systemic
        - R3: critical
        - R4: exceptional
    validations:
      required: true
  - type: textarea
    id: risk_plan
    attributes:
      label: Risk and rollback
      description: Note affected data, tenant boundaries, untrusted inputs, integrations, deployment, and how to reverse the change when relevant.
