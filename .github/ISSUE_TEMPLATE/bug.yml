name: Bug
description: Report reproducible incorrect FaultLane behavior
title: ""
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, including the visible error or wrong result?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest reliable sequence, fixture, or request that reproduces the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Context and verification
      description: Include relevant versions, safe test data, and the check that should prove the fix. Do not attach customer dumps, symbols, credentials, or private fixtures.
