[package]
name = "cachelane-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
cachelane-symbols = { path = "../crates/symbols" }
cachelane-unreal = { path = "../crates/unreal" }
libfuzzer-sys = "0.4"
minidump = "=0.27.0"

[[bin]]
name = "windows_artifact"
path = "fuzz_targets/windows_artifact.rs"
test = false
doc = false
bench = false

[[bin]]
name = "crash_request"
path = "fuzz_targets/crash_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "minidump"
path = "fuzz_targets/minidump.rs"
test = false
doc = false
bench = false
